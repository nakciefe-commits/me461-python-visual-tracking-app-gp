# Builds the Windows .exe on GitHub's own Windows computers (a .exe cannot be
# built on Linux). Runs on every push to the release branch, or by hand
# (Actions tab -> "Build Windows exe" -> Run workflow). The .exe appears under
# the run's "Artifacts"; it is never committed to git.
name: Build Windows exe

on:
  push:
    branches: [release-0.1-beta]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the libraries and PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Run the tests
        run: python -m unittest discover -s tests

      - name: Build the .exe
        run: python packaging/build_exe.py

      - name: Keep the .exe
        uses: actions/upload-artifact@v4
        with:
          name: DontGetCaught-windows
          path: dist/*.exe
